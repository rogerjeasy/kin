name: Deploy

# Deploys Kin to the shared AWS account (docs/architecture.md section 14.8)
# once CI has passed for a push to main: every stack, and the web app, whose
# image CDK builds and App Runner then rolls to. The role kin-github-deploy
# trusts only this repository's main branch, so a run from any other ref is
# refused by AWS.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deployment at a time, and never cancel one half way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Kin
    # After a green CI run for a push to main (lint, types, unit and
    # end-to-end tests, the synth and the image build), or by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/kin-github-deploy
          aws-region: us-east-1
      # Security changes were reviewed in the pull request that brought them.
      # KinGuardrails is left out on purpose: it holds the boundary this
      # deployment runs under, so only a person may change it.
      - name: Deploy everything the web app stands on
        working-directory: infra
        run: pnpm exec cdk deploy KinOps KinNetwork KinData KinCi --require-approval never
        env:
          KIN_ALERT_EMAIL: ${{ secrets.KIN_ALERT_EMAIL }}
          # Unset, Cognito keeps its own sender and password-only sign-in.
          # Set, sign-in codes go by email through Kin's Gmail sender.
          KIN_SENDER_EMAIL: ${{ secrets.KIN_SENDER_EMAIL }}
      # Before the web app rolls out, so it never meets a schema older than its
      # code. A one-off task in Kin's network; the step fails if it does.
      - name: Migrate the database
        working-directory: infra
        run: pnpm run migrate
      # KinWorker exists once kin:paypal in infra/cdk.json names a webhook;
      # until then the app has no such stack and only KinWeb is deployed.
      - name: Build and roll out the web and worker images
        working-directory: infra
        run: pnpm exec cdk deploy KinWeb $(pnpm exec cdk list 2>/dev/null | grep -x KinWorker || true) --require-approval never --outputs-file cdk-outputs.json
        env:
          KIN_ALERT_EMAIL: ${{ secrets.KIN_ALERT_EMAIL }}
          KIN_SENDER_EMAIL: ${{ secrets.KIN_SENDER_EMAIL }}
      - name: Check the live app
        working-directory: infra
        run: pnpm run smoke cdk-outputs.json
