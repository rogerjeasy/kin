name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check

  e2e:
    name: End to end and responsive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @kin/web exec playwright install --with-deps chromium
      # The key journeys only, to keep the pipeline short; `pnpm test:e2e` runs everything.
      - run: pnpm test:e2e:key
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  image:
    name: Build and run the web image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f apps/web/Dockerfile -t kin-web:ci .
      # The image must start and serve its pages, as App Runner will run it.
      - run: |
          docker run -d --name kin-web -p 3000:3000 kin-web:ci
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 2
          done
          curl -sf -o /dev/null -w "home page %{http_code}\n" http://localhost:3000/
          curl -sf -o /dev/null -w "French pricing %{http_code}\n" http://localhost:3000/fr/pricing
      - if: failure()
        run: docker logs kin-web || true
      # The migration task's image (packages/db/Dockerfile) must build too.
      - run: docker build -f packages/db/Dockerfile -t kin-migrate:ci .
      # The worker's image (apps/worker/Dockerfile) too, for the Arm task it
      # runs as. Its last stage only copies files, so no emulation is needed.
      - run: docker build --platform linux/arm64 -f apps/worker/Dockerfile -t kin-worker:ci .

  infra:
    name: Synthesize infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # No AWS credentials here: synth runs CloudFormation's own template
      # checks offline, against a placeholder account.
      - run: pnpm --filter @kin/infra run synth
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          KIN_ALERT_EMAIL: alerts@example.com
