name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check

  e2e:
    name: End to end and responsive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @kin/web exec playwright install --with-deps chromium
      # The key journeys only, to keep the pipeline short; `pnpm test:e2e` runs everything.
      - run: pnpm test:e2e:key
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  image:
    name: Build and run the web image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # AG Studio's licence key, as the deployed image is built with it. Unset
      # (a fork, or before the secret exists) the studio runs unlicensed, and
      # no test depends on the key.
      - run: docker build --build-arg NEXT_PUBLIC_AG_STUDIO_LICENSE -f apps/web/Dockerfile -t kin-web:ci .
        env:
          NEXT_PUBLIC_AG_STUDIO_LICENSE: ${{ secrets.AG_STUDIO_LICENSE }}
      # The image must start and serve its pages, as App Runner will run it.
      - run: |
          docker run -d --name kin-web -p 3000:3000 kin-web:ci
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 2
          done
          curl -sf -o /dev/null -w "home page %{http_code}\n" http://localhost:3000/
          curl -sf -o /dev/null -w "French pricing %{http_code}\n" http://localhost:3000/fr/pricing
      - if: failure()
        run: docker logs kin-web || true
      # The migration task's image (packages/db/Dockerfile) must build too.
      - run: docker build -f packages/db/Dockerfile -t kin-migrate:ci .
      # The worker's image (apps/worker/Dockerfile) too, for the Arm task it
      # runs as. Its last stage only copies files, so no emulation is needed.
      - run: docker build --platform linux/arm64 -f apps/worker/Dockerfile -t kin-worker:ci .
      # The phone service's image (apps/voice/Dockerfile) must start with only
      # the settings of Kin's call about a shift, no office line, and answer its
      # health check, as App Runner will run it. It connects to the database
      # only when a request needs it, so no database is needed here. The values
      # are made up for this run.
      - run: docker build -f apps/voice/Dockerfile -t kin-voice:ci .
      - run: |
          docker run -d --name kin-voice -p 4200:4200 \
            -e KIN_DATABASE_HOST=localhost \
            -e KIN_DATABASE_SERVICE_PASSWORD="$(openssl rand -hex 16)" \
            -e KIN_TWILIO_AUTH_TOKEN="$(openssl rand -hex 16)" \
            -e KIN_VOICE_STATE_KEY="$(openssl rand -hex 32)" \
            -e KIN_VOICE_PUBLIC_URL=https://voice.example.invalid \
            kin-voice:ci
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4200/health && break
            sleep 1
          done
          curl -sf -w " health %{http_code}\n" http://localhost:4200/health
      - if: failure()
        run: docker logs kin-voice || true

  infra:
    name: Synthesize infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # No AWS credentials here: synth runs CloudFormation's own template
      # checks offline, against a placeholder account.
      - run: pnpm --filter @kin/infra run synth
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          KIN_ALERT_EMAIL: alerts@example.com
