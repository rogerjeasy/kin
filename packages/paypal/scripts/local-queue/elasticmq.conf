# The PayPal inbox on this machine: an SQS stand-in with the same FIFO queue
# KinData creates in AWS (infra/src/queues.ts). Started by `pnpm queue:up`.
include classpath("application.conf")

queues {
  "kin-paypal-events.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 180 seconds
  }
}
